<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پتاوو — پنل اعضا — به‌زودی</title>
  <meta name="description" content="پتاوو — پنل اعضا. به‌زودی.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://panel.petavu.ir/">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="پتاوو — به‌زودی">
  <meta property="og:description" content="شبکهٔ کسب‌وکار صنف حیوانات خانگی و اسب.">
  <meta property="og:url" content="https://panel.petavu.ir/">
  <meta property="og:locale" content="fa_IR">
  <meta name="theme-color" content="#03201F">
  <style>
    @font-face {
      font-family: Vazirmatn;
      src: url("assets/vazirmatn-var.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      --brand: #0E7C86;
      --brand-2: #33A7B0;
      --gold: #F5A623;
      --bg: #03201F;
      --ink: #EAF6F7;
      --muted: #9AD3D8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Vazirmatn, Tahoma, sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(14, 124, 134, .35), transparent 60%),
        radial-gradient(900px 500px at 0% 100%, rgba(245, 166, 35, .12), transparent 55%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    main {
      width: min(720px, 100%);
      text-align: center;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
    }
    .mark svg { width: 72px; height: 72px; }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 800;
      letter-spacing: .08em;
    }
    .fa-name {
      margin: 0 0 24px;
      color: var(--gold);
      font-size: 1.15rem;
      font-weight: 600;
    }
    p {
      margin: 0 auto 36px;
      max-width: 38rem;
      line-height: 1.9;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .en {
      margin-top: 10px;
      font-size: .92rem;
      opacity: .75;
      direction: ltr;
    }
    .pill {
      display: inline-block;
      border: 1px solid rgba(154, 211, 216, .35);
      color: var(--brand-2);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: .9rem;
      letter-spacing: .04em;
    }
    footer {
      margin-top: 64px;
      font-size: .8rem;
      color: rgba(234, 246, 247, .45);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="72" height="72">
        <rect width="32" height="32" rx="7" fill="#03201F"/>
        <circle cx="16" cy="16" r="13" fill="none" stroke="#0E7C86" stroke-width="1.5" opacity="0.55"/>
        <path d="M16 6.5c2.9 0 5.2 2.3 5.2 5.2 0 .9-.2 1.8-.7 2.6 1.8 1.4 3.1 3.5 3.1 5.9 0 3.5-2.9 6.3-6.3 6.3h-2.6c-3.5 0-6.3-2.9-6.3-6.3 0-2.4 1.3-4.5 3.1-5.9-.4-.8-.7-1.7-.7-2.6 0-2.9 2.3-5.2 5.2-5.2Z" fill="none" stroke="#F5A623" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="13.4" cy="19.2" r="1.3" fill="#F5A623"/>
        <circle cx="18.6" cy="19.2" r="1.3" fill="#F5A623"/>
      </svg>
    </div>
    <h1>PETAVU</h1>
    <div class="fa-name">پتاوو</div>
    <p>
      ورود اعضا به‌زودی.
      <span class="en">Member panel. Coming soon.</span>
    </p>
    <span class="pill">به‌زودی</span>
    <footer>panel.petavu.ir</footer>
  </main>
</body>
</html>
